services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: erp_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # ينتظر حتى تصبح قاعدة البيانات جاهزة فعلاً ثم يهيّئ الجداول والبيانات
    command: >
      sh -c "until php artisan migrate --force --seed; do
               echo 'قاعدة البيانات لم تجهز بعد — إعادة المحاولة خلال 3 ثوانٍ...';
               sleep 3;
             done &&
             php artisan serve --host=0.0.0.0 --port=8000"

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  db_data:
